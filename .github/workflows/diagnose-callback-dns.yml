name: Diagnose Callback Certificate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-callback-dns.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

      - name: Print production TLS state
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set +e
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/neshoone || exit 0
          echo 'DIAG_BEGIN'

          echo -n 'ACTIVE_CALLBACK_CONFIG='
          docker compose exec -T caddy sh -c \
            'wget -qO- http://127.0.0.1:2019/config/ | grep -q "neshoone.hamooncloud.ir"' \
            && echo yes || echo no

          echo 'CERTIFICATE_FILES='
          docker compose exec -T caddy sh -c \
            'find /data/caddy -type f 2>/dev/null | grep "neshoone.hamooncloud.ir" | sort' || true

          echo 'LOCAL_CERTIFICATE='
          timeout 15 openssl s_client -connect 127.0.0.1:443 \
            -servername neshoone.hamooncloud.ir -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || true

          echo 'LOCAL_HEALTH='
          curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
            --max-time 15 https://neshoone.hamooncloud.ir/health || true
          echo

          public_ip="$(curl -4 -fsS --max-time 15 https://api.ipify.org 2>/dev/null)"
          echo 'PUBLIC_IP_HAIRPIN='
          curl -4vk --resolve "neshoone.hamooncloud.ir:443:${public_ip}" \
            --max-time 20 https://neshoone.hamooncloud.ir/health 2>&1 | tail -n 35 || true

          echo 'CALLBACK_TLS_LOGS='
          docker compose logs --since=45m caddy 2>/dev/null \
            | grep -E 'neshoone.hamooncloud.ir|tls.obtain|certificate obtained|challenge failed|authorization' \
            | tail -n 80 || true
          echo 'DIAG_END'
          REMOTE

      - name: Print public TLS state
        run: |
          set +e
          echo 'PUBLIC_RUNNER_BEGIN'
          timeout 20 openssl s_client -connect neshoone.hamooncloud.ir:443 \
            -servername neshoone.hamooncloud.ir -showcerts </dev/null 2>&1 | tail -n 35
          curl -4vk --max-time 20 https://neshoone.hamooncloud.ir/health 2>&1 | tail -n 35
          echo 'PUBLIC_RUNNER_END'
          exit 0
