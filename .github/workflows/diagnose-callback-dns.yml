name: Diagnose Active Callback TLS

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-callback-dns.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y sshpass openssl dnsutils

      - name: Inspect production internals
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/neshoone
          public_ip="$(curl -4 -fsS --max-time 20 https://api.ipify.org)"
          echo "PUBLIC_IP=${public_ip}"

          echo '=== Active Caddy config contains callback ==='
          docker compose exec -T caddy wget -qO- http://127.0.0.1:2019/config/ \
            | grep -o 'neshoone.hamooncloud.ir' | head || true

          echo '=== Stored callback certificate files ==='
          docker compose exec -T caddy sh -c \
            "find /data/caddy -type f | grep 'neshoone.hamooncloud.ir' | sort" || true

          echo '=== Local callback certificate ==='
          timeout 20 openssl s_client -connect 127.0.0.1:443 \
            -servername neshoone.hamooncloud.ir -showcerts </dev/null 2>/tmp/local-ssl.err \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          cat /tmp/local-ssl.err || true

          echo '=== Public-IP callback from the server ==='
          curl -4vk --max-time 25 \
            --resolve "neshoone.hamooncloud.ir:443:${public_ip}" \
            https://neshoone.hamooncloud.ir/health || true

          echo '=== NAT rules for 443 ==='
          iptables-save 2>/dev/null | grep -E '443|DOCKER' | tail -n 100 || true
          nft list ruleset 2>/dev/null | grep -C 3 -E 'dport 443|:443' | tail -n 120 || true

          echo '=== Recent Caddy TLS logs ==='
          docker compose logs --since=15m caddy | grep -E \
            'hamooncloud|certificate|handshake|tls.obtain|automation' | tail -n 220 || true
          REMOTE

      - name: Inspect from public runner
        run: |
          set +e
          echo '=== DNS ==='
          dig +short @1.1.1.1 A neshoone.hamooncloud.ir
          echo '=== OpenSSL ==='
          timeout 25 openssl s_client -connect neshoone.hamooncloud.ir:443 \
            -servername neshoone.hamooncloud.ir -showcerts </dev/null
          echo '=== Curl ==='
          curl -4vk --max-time 25 https://neshoone.hamooncloud.ir/health
