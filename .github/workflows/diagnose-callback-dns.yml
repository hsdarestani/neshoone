name: Repair Callback TLS

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-callback-dns.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reload production Caddy config
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/neshoone

          docker compose exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

          ready=0
          for _ in $(seq 1 36); do
            if curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
              https://neshoone.hamooncloud.ir/health > /tmp/callback-health 2>/tmp/callback-error; then
              ready=1
              break
            fi
            sleep 5
          done

          echo '=== Callback response ==='
          cat /tmp/callback-health 2>/dev/null || true
          cat /tmp/callback-error 2>/dev/null || true
          echo '=== Caddy certificate logs ==='
          docker compose logs --tail=220 caddy

          if [ "$ready" -ne 1 ]; then
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/callback-health
          REMOTE

      - name: Verify callback publicly
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 24 --retry-all-errors --retry-delay 5 \
            https://neshoone.hamooncloud.ir/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
