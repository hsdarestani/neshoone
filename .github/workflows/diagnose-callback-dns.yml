name: Diagnose Callback Certificate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-callback-dns.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

      - name: Read active TLS state
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          output="$(sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/neshoone

          active=no
          docker compose exec -T caddy sh -c \
            'wget -qO- http://127.0.0.1:2019/config/ | grep -q "neshoone.hamooncloud.ir"' \
            && active=yes

          cert_count="$(docker compose exec -T caddy sh -c \
            'find /data/caddy -type f 2>/dev/null | grep -c "neshoone.hamooncloud.ir"' 2>/dev/null)"
          cert_count="${cert_count:-0}"

          cert_subject="$(timeout 15 openssl s_client -connect 127.0.0.1:443 \
            -servername neshoone.hamooncloud.ir -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject 2>/dev/null | head -n1)"
          cert_subject="${cert_subject:-none}"

          local_http="$(curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
            --max-time 15 -o /tmp/callback-body -w '%{http_code}' \
            https://neshoone.hamooncloud.ir/health 2>/dev/null)"
          local_http="${local_http:-000}"

          public_ip="$(curl -4 -fsS --max-time 15 https://api.ipify.org 2>/dev/null)"
          hairpin_http="$(curl -4 -fsS --resolve "neshoone.hamooncloud.ir:443:${public_ip}" \
            --max-time 15 -o /tmp/hairpin-body -w '%{http_code}' \
            https://neshoone.hamooncloud.ir/health 2>/dev/null)"
          hairpin_http="${hairpin_http:-000}"

          echo "ACTIVE=${active}"
          echo "CERT_COUNT=${cert_count}"
          echo "CERT_SUBJECT=${cert_subject}"
          echo "LOCAL_HTTP=${local_http}"
          echo "HAIRPIN_HTTP=${hairpin_http}"
          echo 'TLS_LOGS_BEGIN'
          docker compose logs --since=30m caddy 2>/dev/null \
            | grep -E 'neshoone.hamooncloud.ir|tls.obtain|certificate obtained|challenge failed|authorization' \
            | tail -n 60 || true
          echo 'TLS_LOGS_END'
          REMOTE
          )"
          printf '%s\n' "$output"

      - name: Check public endpoint
        run: |
          set +e
          http="$(curl -4ksS --max-time 20 -o /tmp/public-body -w '%{http_code}' \
            https://neshoone.hamooncloud.ir/health)"
          echo "PUBLIC_HTTP=${http:-000}"
          cat /tmp/public-body 2>/dev/null || true
