name: Repair Callback Certificate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-callback-dns.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null

      - name: Recreate Caddy and wait for certificate
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/neshoone

          # The bind-mounted Caddyfile was replaced on disk by deployment while the
          # running container still referenced the old inode. Recreate to remount it.
          docker compose up -d --force-recreate --no-deps caddy

          active=0
          for _ in $(seq 1 20); do
            if docker compose exec -T caddy sh -c \
              'wget -qO- http://127.0.0.1:2019/config/ | grep -q "neshoone.hamooncloud.ir"'; then
              active=1
              break
            fi
            sleep 2
          done
          if [ "$active" -ne 1 ]; then
            docker compose logs --tail=200 caddy
            exit 1
          fi

          ready=0
          for _ in $(seq 1 48); do
            if curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
              https://neshoone.hamooncloud.ir/health >/tmp/callback-health 2>/tmp/callback-error; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/callback-error 2>/dev/null || true
            docker compose logs --tail=240 caddy
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/callback-health
          echo 'LOCAL_CALLBACK_OK'
          docker compose logs --since=10m caddy \
            | grep -E 'neshoone.hamooncloud.ir|certificate obtained|authorization finalized' \
            | tail -n 40 || true
          REMOTE

      - name: Verify callback publicly
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 24 --retry-all-errors --retry-delay 5 \
            https://neshoone.hamooncloud.ir/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
