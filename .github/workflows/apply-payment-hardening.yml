name: Apply Payment UX Patch

on:
  push:
    branches:
      - agent/fix-callback-tls
    paths:
      - '.github/workflows/apply-payment-hardening.yml'

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Mark patch pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"patch/payment-ux","description":"Adding VPN guidance to payment flow"}'

      - uses: actions/checkout@v4
        with:
          ref: agent/fix-callback-tls

      - name: Add VPN guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/bot.py')
          text = path.read_text()
          old = '                "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود.",'
          new = (
              '                "⚠️ قبل از ورود به درگاه، فیلترشکن یا VPN را خاموش کن.\\n"\n'
              '                "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود. "\n'
              '                "اگر صفحه برگشت باز نشد، چند لحظه بعد کیف پول را دوباره بررسی کن.",'
          )
          if old not in text:
              raise SystemExit('payment message marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot.py
          git commit -m "Tell users to disable VPN before Zibal payment"
          git push origin HEAD:agent/fix-callback-tls

      - name: Mark patch success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"patch/payment-ux","description":"Payment guidance committed"}'

      - name: Mark patch failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"patch/payment-ux","description":"Payment guidance patch failed"}'
