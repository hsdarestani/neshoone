name: Apply Payment Hardening

on:
  push:
    branches:
      - agent/fix-callback-tls
    paths:
      - '.github/workflows/apply-payment-hardening.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-payment-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-callback-tls

      - name: Patch payment UX and reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path("app/bot.py")
          text = bot.read_text()
          old = '                "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود.",'
          new = (
              '                "⚠️ قبل از ورود به درگاه، فیلترشکن یا VPN را خاموش کن.\\n"\n'
              '                "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود. "\n'
              '                "اگر صفحه برگشت باز نشد، ربات وضعیت پرداخت را خودش بررسی می‌کند.",'
          )
          if old not in text:
              raise SystemExit("bot payment message marker not found")
          bot.write_text(text.replace(old, new, 1))

          db = Path("app/db.py")
          text = db.read_text()
          marker = "    async def credit_verified_payment(\n"
          method = '''    async def pending_payments(self, limit: int = 100) -> list[dict[str, Any]]:
              async with aiosqlite.connect(self.path) as db:
                  db.row_factory = aiosqlite.Row
                  rows = await (
                      await db.execute(
                          """
                          SELECT * FROM payments
                          WHERE status='pending' AND track_id IS NOT NULL
                          ORDER BY created_at ASC LIMIT ?
                          """,
                          (limit,),
                      )
                  ).fetchall()
                  return [dict(row) for row in rows]

'''
          if marker not in text:
              raise SystemExit("db payment marker not found")
          db.write_text(text.replace(marker, method + marker, 1))

          main = Path("app/main.py")
          text = main.read_text()
          import_marker = "import logging\nfrom contextlib import asynccontextmanager"
          if import_marker not in text:
              raise SystemExit("main import marker not found")
          text = text.replace(
              import_marker,
              "import asyncio\nimport logging\nfrom contextlib import asynccontextmanager, suppress",
              1,
          )

          lifecycle_marker = "@asynccontextmanager\nasync def lifespan(_: FastAPI):\n"
          helpers = '''async def reconcile_pending_payments_once() -> None:
              for payment in await db.pending_payments():
                  try:
                      verified = await zibal.verify_payment(str(payment["track_id"]))
                  except ZibalError:
                      continue
                  credit = await db.credit_verified_payment(
                      payment_id=payment["id"],
                      verified_amount_rial=verified["amount_rial"],
                      zibal_result=verified["result"],
                      ref_number=verified["ref_number"],
                      card_number=verified["card_number"],
                  )
                  if not credit.get("ok") or credit.get("duplicate"):
                      continue
                  logger.info("Reconciled Zibal payment %s", payment["id"])
                  try:
                      await bot.send_message(
                          chat_id=credit["user_id"],
                          text=(
                              "✅ <b>کیف پولت شارژ شد</b>\\n\\n"
                              f"مبلغ: <b>{format_toman(credit['amount_toman'])} تومان</b>\\n"
                              f"موجودی جدید: <b>{format_toman(credit['balance'])} تومان</b>\\n\\n"
                              "صفحه برگشت درگاه باز نشد، اما پرداخت از زیبال استعلام و با موفقیت ثبت شد."
                          ),
                          parse_mode="HTML",
                          reply_markup=main_keyboard(),
                      )
                  except Exception:
                      logger.exception("Reconciled payment notification failed")


          async def payment_reconciliation_loop() -> None:
              while True:
                  try:
                      await reconcile_pending_payments_once()
                  except asyncio.CancelledError:
                      raise
                  except Exception:
                      logger.exception("Pending payment reconciliation failed")
                  await asyncio.sleep(60)


'''
          if lifecycle_marker not in text:
              raise SystemExit("main lifespan marker not found")
          text = text.replace(lifecycle_marker, helpers + lifecycle_marker, 1)

          tail = "    yield\n    await bot.session.close()\n"
          replacement = '''    reconciliation_task = asyncio.create_task(payment_reconciliation_loop())
              try:
                  yield
              finally:
                  reconciliation_task.cancel()
                  with suppress(asyncio.CancelledError):
                      await reconciliation_task
                  await bot.session.close()
          '''
          if tail not in text:
              raise SystemExit("main lifespan tail not found")
          main.write_text(text.replace(tail, replacement, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot.py app/db.py app/main.py
          git commit -m "Harden payment return and reconcile pending charges"
          git push origin HEAD:agent/fix-callback-tls
