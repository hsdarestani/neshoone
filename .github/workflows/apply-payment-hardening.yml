name: Apply Payment Hardening

on:
  push:
    branches:
      - agent/fix-callback-tls
    paths:
      - '.github/workflows/apply-payment-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-callback-tls

      - name: Patch payment UX and reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('app/bot.py')
          text = bot.read_text()
          old = '''                f"مبلغ شارژ: <b>{format_toman(amount)} تومان</b>\\n\\n"
                          "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود.",'''
          new = '''                f"مبلغ شارژ: <b>{format_toman(amount)} تومان</b>\\n\\n"
                          "⚠️ قبل از ورود به درگاه، فیلترشکن یا VPN را خاموش کن.\\n"
                          "بعد از پرداخت، موجودی کیف پول به‌صورت خودکار اضافه می‌شود. "
                          "اگر صفحه برگشت باز نشد، ربات وضعیت پرداخت را خودش بررسی می‌کند.",'''
          if old not in text:
              raise SystemExit('bot payment message marker not found')
          bot.write_text(text.replace(old, new, 1))

          db = Path('app/db.py')
          text = db.read_text()
          marker = '''    async def credit_verified_payment(
          '''
          method = '''    async def pending_payments(self, limit: int = 100) -> list[dict[str, Any]]:
              async with aiosqlite.connect(self.path) as db:
                  db.row_factory = aiosqlite.Row
                  rows = await (
                      await db.execute(
                          """
                          SELECT * FROM payments
                          WHERE status='pending' AND track_id IS NOT NULL
                          ORDER BY created_at ASC LIMIT ?
                          """,
                          (limit,),
                      )
                  ).fetchall()
                  return [dict(row) for row in rows]

'''
          if marker not in text:
              raise SystemExit('db credit marker not found')
          db.write_text(text.replace(marker, method + marker, 1))

          main = Path('app/main.py')
          text = main.read_text()
          text = text.replace('import logging\nfrom contextlib import asynccontextmanager',
                              'import asyncio\nimport logging\nfrom contextlib import asynccontextmanager, suppress', 1)

          lifecycle_marker = '''@asynccontextmanager
          async def lifespan(_: FastAPI):
          '''
          helpers = '''async def notify_payment_credit(credit: dict[str, Any]) -> None:
              if credit.get("duplicate") or not credit.get("ok"):
                  return
              try:
                  await bot.send_message(
                      chat_id=credit["user_id"],
                      text=(
                          "✅ <b>کیف پولت شارژ شد</b>\\n\\n"
                          f"مبلغ: <b>{format_toman(credit['amount_toman'])} تومان</b>\\n"
                          f"موجودی جدید: <b>{format_toman(credit['balance'])} تومان</b>\\n\\n"
                          "حالا می‌تونی نشونه جدیدت رو بگیری."
                      ),
                      parse_mode="HTML",
                      reply_markup=main_keyboard(),
                  )
              except Exception:
                  logger.exception("Payment succeeded but Telegram notification failed")


          async def reconcile_pending_payments_once() -> None:
              for payment in await db.pending_payments():
                  try:
                      verified = await zibal.verify_payment(str(payment["track_id"]))
                  except ZibalError:
                      continue
                  credit = await db.credit_verified_payment(
                      payment_id=payment["id"],
                      verified_amount_rial=verified["amount_rial"],
                      zibal_result=verified["result"],
                      ref_number=verified["ref_number"],
                      card_number=verified["card_number"],
                  )
                  if credit.get("ok") and not credit.get("duplicate"):
                      logger.info("Reconciled Zibal payment %s", payment["id"])
                      await notify_payment_credit(credit)


          async def payment_reconciliation_loop() -> None:
              while True:
                  try:
                      await reconcile_pending_payments_once()
                  except asyncio.CancelledError:
                      raise
                  except Exception:
                      logger.exception("Pending payment reconciliation failed")
                  await asyncio.sleep(60)


'''
          if lifecycle_marker not in text:
              raise SystemExit('lifespan marker not found')
          text = text.replace(lifecycle_marker, helpers + lifecycle_marker, 1)

          old_lifespan_tail = '''    yield
              await bot.session.close()
          '''
          new_lifespan_tail = '''    reconciliation_task = asyncio.create_task(payment_reconciliation_loop())
              try:
                  yield
              finally:
                  reconciliation_task.cancel()
                  with suppress(asyncio.CancelledError):
                      await reconciliation_task
                  await bot.session.close()
          '''
          if old_lifespan_tail not in text:
              raise SystemExit('lifespan tail marker not found')
          text = text.replace(old_lifespan_tail, new_lifespan_tail, 1)

          old_notify = '''    if not credit.get("duplicate"):
                  try:
                      await bot.send_message(
                          chat_id=credit["user_id"],
                          text=(
                              "✅ <b>کیف پولت شارژ شد</b>\\n\\n"
                              f"مبلغ: <b>{format_toman(credit['amount_toman'])} تومان</b>\\n"
                              f"موجودی جدید: <b>{format_toman(credit['balance'])} تومان</b>\\n\\n"
                              "حالا می‌تونی نشونه جدیدت رو بگیری."
                          ),
                          parse_mode="HTML",
                          reply_markup=main_keyboard(),
                      )
                  except Exception:
                      logger.exception("Payment succeeded but Telegram notification failed")
          '''
          new_notify = '''    await notify_payment_credit(credit)
          '''
          if old_notify not in text:
              raise SystemExit('callback notification marker not found')
          main.write_text(text.replace(old_notify, new_notify, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot.py app/db.py app/main.py
          git commit -m "Harden payment return and reconcile pending charges"
          git push origin HEAD:agent/fix-callback-tls
