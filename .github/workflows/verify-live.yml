name: Verify Live Production

on:
  push:
    branches:
      - agent/verify-live-production
    paths:
      - '.github/workflows/verify-live.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Inspect production and test Zibal
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail

          ssh_cmd=(sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}")

          admin_present="$(${ssh_cmd[@]} "grep -q 'AdminService' /opt/neshoone/app/main.py && echo yes || echo no" | tail -n1 | tr -d '\r')"
          local_health="$(${ssh_cmd[@]} "cd /opt/neshoone && docker compose exec -T app python -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read().decode())\"" 2>/dev/null | tail -n1 | tr -d '\r' || true)"
          callback_dns="$(${ssh_cmd[@]} "getent ahostsv4 neshoone.hamooncloud.ir | awk 'NR==1{print \\$1}'" | tail -n1 | tr -d '\r' || true)"
          callback_remote_http="$(${ssh_cmd[@]} "curl -sS -o /tmp/callback-health.out -w '%{http_code}' --max-time 25 https://neshoone.hamooncloud.ir/health || true" | tail -n1 | tr -d '\r')"

          zibal_result="$(${ssh_cmd[@]} "cd /opt/neshoone && docker compose exec -T app python -c \"import os,httpx; p={'merchant':os.environ['ZIBAL_MERCHANT'],'amount':500000,'callbackUrl':'https://neshoone.hamooncloud.ir/payments/zibal/callback','orderId':'verify-live-production','description':'Neshoone live verification'}; r=httpx.post('https://gateway.zibal.ir/request',json=p,timeout=30); print(r.json().get('result','none'))\"" 2>/dev/null | tail -n1 | tr -d '\r' || true)"

          main_http="$(curl -sS -o /tmp/main.out -w '%{http_code}' --max-time 25 https://neshoone.smarbiz.sbs/health || true)"
          callback_http="$(curl -sS -o /tmp/callback.out -w '%{http_code}' --max-time 25 https://neshoone.hamooncloud.ir/health || true)"
          local_label=bad
          [ "$local_health" = '{"status":"ok"}' ] && local_label=ok
          [ -n "$callback_dns" ] || callback_dns=none
          [ -n "$zibal_result" ] || zibal_result=none
          [ -n "$admin_present" ] || admin_present=none

          for context in \
            "live/admin-${admin_present}" \
            "live/local-health-${local_label}" \
            "live/main-http-${main_http}" \
            "live/callback-dns-${callback_dns}" \
            "live/callback-runner-http-${callback_http}" \
            "live/callback-server-http-${callback_remote_http}" \
            "live/zibal-result-${zibal_result}"; do
            context="${context:0:100}"
            payload="$(jq -n --arg context "$context" '{state:"success",context:$context,description:"Neshoone live verification"}')"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
          done
