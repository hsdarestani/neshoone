name: Deploy Neshoone

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: neshoone-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"deploy/production","description":"Deploying Neshoone to production"}'

      - name: Validate required secrets
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOTTOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
          ZIBAL_MERCHANT: ${{ secrets.ZIBALMERCHANT }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_PASS BOT_TOKEN OPENAI_API_KEY ZIBAL_MERCHANT; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      - name: Prepare deployment bundle
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.BOTTOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAIAPIKEY }}
          ZIBAL_MERCHANT: ${{ secrets.ZIBALMERCHANT }}
        run: |
          set -euo pipefail
          cat > /tmp/neshoone.env <<EOF
          BOT_TOKEN=${BOT_TOKEN}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          ZIBAL_MERCHANT=${ZIBAL_MERCHANT}
          BASE_URL=https://neshoone.smarbiz.sbs
          ZIBAL_CALLBACK_BASE_URL=https://neshoone.hamooncloud.ir
          DOMAIN=neshoone.smarbiz.sbs
          DATABASE_PATH=/data/neshoone.db
          OPENAI_MODEL=gpt-4.1-mini
          FORTUNE_PRICE_TOMAN=10000
          IMAGE_DETAIL=high
          MAX_IMAGE_SIDE=1280
          EOF
          chmod 600 /tmp/neshoone.env
          tar --exclude=.git --exclude=.github -czf /tmp/neshoone.tar.gz .

      - name: Install SSH client helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload release
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/neshoone"
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/neshoone.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/neshoone.tar.gz"
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/neshoone.env "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/neshoone.env"

      - name: Start production stack
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi
          mkdir -p /opt/neshoone
          tar -xzf /tmp/neshoone.tar.gz -C /opt/neshoone
          install -m 600 /tmp/neshoone.env /opt/neshoone/.env
          cd /opt/neshoone
          docker compose up -d --build --remove-orphans

          # Compose does not recreate Caddy when only the mounted Caddyfile changes.
          # Reload it explicitly so new domains and TLS certificates are activated.
          if ! docker compose exec -T caddy \
            caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
            docker compose restart caddy
          fi

          healthy=0
          for _ in $(seq 1 30); do
            if docker compose exec -T app python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=200
            exit 1
          fi

          callback_ready=0
          for _ in $(seq 1 36); do
            if curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
              https://neshoone.hamooncloud.ir/health >/tmp/callback-health 2>/tmp/callback-error; then
              callback_ready=1
              break
            fi
            sleep 5
          done
          if [ "$callback_ready" -ne 1 ]; then
            cat /tmp/callback-error 2>/dev/null || true
            docker compose logs --tail=220 caddy
            exit 1
          fi
          grep -q '"status":"ok"' /tmp/callback-health

          docker image prune -f
          docker compose ps
          rm -f /tmp/neshoone.tar.gz /tmp/neshoone.env
          REMOTE

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          for url in \
            https://neshoone.smarbiz.sbs/health \
            https://neshoone.hamooncloud.ir/health; do
            response="$(curl -fsS --retry 18 --retry-all-errors --retry-delay 5 "$url")"
            echo "$url => $response"
            echo "$response" | grep -q '"status":"ok"'
          done

      - name: Mark deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"deploy/production","description":"Neshoone is healthy on both domains"}'

      - name: Mark deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"deploy/production","description":"Neshoone production deployment failed"}'
