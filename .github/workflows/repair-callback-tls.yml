name: Repair Callback TLS

on:
  push:
    branches:
      - agent/fix-callback-tls
    paths:
      - '.github/workflows/repair-callback-tls.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}

    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reload Caddy and inspect TLS
        shell: bash
        env:
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/neshoone

          echo '=== DNS from production ==='
          getent ahostsv4 neshoone.hamooncloud.ir || true

          echo '=== Caddy config ==='
          cat Caddyfile
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile

          echo '=== Restart Caddy ==='
          docker compose restart caddy

          ready=0
          for _ in $(seq 1 24); do
            if curl -fsS --resolve neshoone.hamooncloud.ir:443:127.0.0.1 \
              https://neshoone.hamooncloud.ir/health >/tmp/callback-health 2>/tmp/callback-curl-error; then
              ready=1
              break
            fi
            sleep 5
          done

          echo '=== Caddy logs ==='
          docker compose logs --tail=160 caddy

          echo '=== Local TLS probe ==='
          cat /tmp/callback-health 2>/dev/null || true
          cat /tmp/callback-curl-error 2>/dev/null || true

          if [ "$ready" -ne 1 ]; then
            exit 1
          fi
          REMOTE

      - name: Verify callback domain publicly
        run: |
          set -euo pipefail
          curl -fsS --retry 18 --retry-all-errors --retry-delay 5 \
            https://neshoone.hamooncloud.ir/health | grep -q '"status":"ok"'
